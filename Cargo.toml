[workspace]
members = ["crates/*"]
exclude = ["apps/native-viewer"]
resolver = "3"

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Eliseowzy/nimbleoffice"

[workspace.dependencies]
ooxml-raster = { package = "nimbleoffice-ooxml-raster", path = "crates/ooxml-raster", version = "0.5.1" }
nimbleoffice-fonts-latin = { path = "crates/nimbleoffice-fonts-latin", version = "0.5.1" }
nimbleoffice-fonts-intl = { path = "crates/nimbleoffice-fonts-intl", version = "0.5.1" }
nimbleoffice-fonts-cjk-sc = { path = "crates/nimbleoffice-fonts-cjk-sc", version = "0.5.1" }
nimbleoffice-fonts-cjk-tc = { path = "crates/nimbleoffice-fonts-cjk-tc", version = "0.5.1" }
nimbleoffice-fonts-cjk-jp = { path = "crates/nimbleoffice-fonts-cjk-jp", version = "0.5.1" }
nimbleoffice-fonts-cjk-kr = { path = "crates/nimbleoffice-fonts-cjk-kr", version = "0.5.1" }
nimbleoffice-fonts-cjk-serif-sc = { path = "crates/nimbleoffice-fonts-cjk-serif-sc", version = "0.5.1" }
nimbleoffice-fonts-cjk = { path = "crates/nimbleoffice-fonts-cjk", version = "0.5.1" }

base-latin = { package = "nimbleoffice-base-latin", path = "crates/base-latin", version = "0.5.1" }
nimbleoffice-fonts = { path = "crates/nimbleoffice-fonts", version = "0.5.1", default-features = false }
quick-xml = "0.41"
wasm-bindgen = "0.2"
libm = "=0.2.15"
nimbleoffice-xlsx = { path = "crates/nimbleoffice-xlsx", version = "0.5.1", default-features = false }
ooxml-opc = { package = "nimbleoffice-opc", path = "crates/ooxml-opc", version = "0.5.1" }
xlsx-model = { package = "nimbleoffice-xlsx-model", path = "crates/xlsx-model", version = "0.5.1" }
xlsx-parse = { package = "nimbleoffice-xlsx-parse", path = "crates/xlsx-parse", version = "0.5.1" }
xlsx-calc = { package = "nimbleoffice-xlsx-calc", path = "crates/xlsx-calc", version = "0.5.1" }
xlsx-ops = { package = "nimbleoffice-xlsx-ops", path = "crates/xlsx-ops", version = "0.5.1" }
xlsx-render = { package = "nimbleoffice-xlsx-render", path = "crates/xlsx-render", version = "0.5.1" }
xlsx-raster = { package = "nimbleoffice-xlsx-raster", path = "crates/xlsx-raster", version = "0.5.1" }
ooxml-text = { package = "nimbleoffice-ooxml-text", path = "crates/ooxml-text", version = "0.5.1" }
ooxml-diff = { package = "nimbleoffice-ooxml-diff", path = "crates/ooxml-diff", version = "0.5.1" }
ooxml-drawingml = { package = "nimbleoffice-drawingml", path = "crates/ooxml-drawingml", version = "0.5.1" }
ooxml-metafile = { package = "nimbleoffice-metafile", path = "crates/ooxml-metafile", version = "0.5.1" }
docx-parse = { package = "nimbleoffice-docx-parse", path = "crates/docx-parse", version = "0.5.1" }
docx-layout = { package = "nimbleoffice-docx-layout", path = "crates/docx-layout", version = "0.5.1" }
docx-raster = { package = "nimbleoffice-docx-raster", path = "crates/docx-raster", version = "0.5.1" }
docx-pdf = { package = "nimbleoffice-docx-pdf", path = "crates/docx-pdf", version = "0.5.1" }
docx-edit = { package = "nimbleoffice-docx-edit", path = "crates/docx-edit", version = "0.5.1" }
docx-engine = { package = "nimbleoffice-docx-engine", path = "crates/docx-engine" }
nimbleoffice-docx = { path = "crates/nimbleoffice-docx", version = "0.5.1" }
pptx-parse = { package = "nimbleoffice-pptx-parse", path = "crates/pptx-parse", version = "0.5.1" }
pptx-edit = { package = "nimbleoffice-pptx-edit", path = "crates/pptx-edit", version = "0.5.1" }
pptx-engine = { package = "nimbleoffice-pptx-engine", path = "crates/pptx-engine", default-features = false }
pptx-render = { package = "nimbleoffice-pptx-render", path = "crates/pptx-render", version = "0.5.1" }
pptx-raster = { package = "nimbleoffice-pptx-raster", path = "crates/pptx-raster", version = "0.5.1" }
nimbleoffice-pptx = { path = "crates/nimbleoffice-pptx", version = "0.5.1" }
vsdx-parse = { package = "nimbleoffice-vsdx-parse", path = "crates/vsdx-parse", version = "0.5.1" }
vsdx-formula = { package = "nimbleoffice-vsdx-formula", path = "crates/vsdx-formula", version = "0.5.1" }
vsdx-resolve = { package = "nimbleoffice-vsdx-resolve", path = "crates/vsdx-resolve", version = "0.5.1" }
vsdx-eval = { package = "nimbleoffice-vsdx-eval", path = "crates/vsdx-eval", version = "0.5.1" }
vsdx-render = { package = "nimbleoffice-vsdx-render", path = "crates/vsdx-render", version = "0.5.1" }
vsdx-raster = { package = "nimbleoffice-vsdx-raster", path = "crates/vsdx-raster", version = "0.5.1" }
vsdx-validate = { package = "nimbleoffice-vsdx-validate", path = "crates/vsdx-validate", version = "0.5.1" }
vsdx-edit = { package = "nimbleoffice-vsdx-edit", path = "crates/vsdx-edit", version = "0.5.1" }
nimbleoffice-vsdx = { path = "crates/nimbleoffice-vsdx", version = "0.5.1" }

[profile.test]
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = true

[profile.fonts-decoder]
inherits = "release"
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package.nimbleoffice-docx-layout]
opt-level = 3

[profile.release.package.nimbleoffice-docx-parse]
opt-level = 3

[profile.release.package.nimbleoffice-ooxml-font-preflight]
opt-level = "z"

# The per-keystroke hot path lives in docx-edit (engine session, frame
# encoding), ooxml-text (shaping/measurement), and yrs (text CRDT ops); the
# size-optimized workspace default measurably slows all three.
[profile.release.package.nimbleoffice-docx-edit]
opt-level = 3

[profile.release.package.nimbleoffice-ooxml-text]
opt-level = 3

[profile.release.package.yrs]
opt-level = 3
