[package]
name = "nimbleoffice-xlsx-native"
version = "0.5.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Eliseowzy/nimbleoffice"
description = "Node.js bindings for the NimbleOffice XLSX engine."
publish = false

[lib]
crate-type = ["cdylib"]

[features]
test-hooks = []

[dependencies]
nimbleoffice-fonts = { path = "../../crates/nimbleoffice-fonts" }
nimbleoffice-xlsx-engine = { path = "../../crates/xlsx-engine", features = ["raster", "fonts"] }
napi = { version = "3.12.4", features = ["napi8", "serde-json"] }
napi-derive = "3.6.5"

[build-dependencies]
napi-build = "2.4.2"
