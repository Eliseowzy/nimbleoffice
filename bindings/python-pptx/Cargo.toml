[package]
name = "nimbleoffice-pptx-python"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Eliseowzy/nimbleoffice"
description = "Python bindings for the NimbleOffice PPTX engine."
publish = false

[lib]
name = "_nimbleoffice_pptx"
crate-type = ["cdylib"]

[dependencies]
nimbleoffice-pptx = { path = "../../crates/nimbleoffice-pptx", default-features = false, features = ["fonts", "raster"] }
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
python-common = { package = "nimbleoffice-python-common", path = "../python-common" }
serde_json = { version = "1", features = ["float_roundtrip"] }
