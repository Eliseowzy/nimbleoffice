[package]
name = "nimbleoffice-docx-python"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Eliseowzy/nimbleoffice"
description = "Python bindings for the NimbleOffice DOCX engine."
publish = false

[lib]
name = "_nimbleoffice_docx"
crate-type = ["cdylib"]

[dependencies]
nimbleoffice-docx = { path = "../../crates/nimbleoffice-docx", default-features = false, features = ["fonts", "raster"] }
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
python-common = { package = "nimbleoffice-python-common", path = "../python-common" }
serde_json = "1"
