[package]
name = "nimbleoffice-vsdx-python"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Eliseowzy/nimbleoffice"
description = "Python bindings for the NimbleOffice VSDX engine."
publish = false

[lib]
name = "_nimbleoffice_vsdx"
crate-type = ["cdylib"]

[dependencies]
nimbleoffice-vsdx = { path = "../../crates/nimbleoffice-vsdx", default-features = false, features = ["raster"] }
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
python-common = { package = "nimbleoffice-python-common", path = "../python-common" }
vsdx-parse = { path = "../../crates/vsdx-parse", package = "nimbleoffice-vsdx-parse" }
