name: End-to-end

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-build:
    name: Browser build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: e2e-browser
          workspaces: |
            . -> target
            bindings -> target

      - uses: ./.github/actions/wasm-toolchain

      - name: Fingerprint the wasm inputs
        id: wasm
        run: echo "key=$(bun scripts/wasm-cache-key.ts)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/wasm-pack
          key: wasm-pack-${{ steps.wasm.outputs.key }}

      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12
        with:
          tool: wasm-pack@0.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the packages and the desktop app
        run: bun run pretest:e2e:browser

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-browser-build
          path: |
            apps/desktop/dist
            packages/*/dist
            packages/*/src/wasm
            target/wasm-pack
          if-no-files-found: error
          retention-days: 3

  browser:
    name: ${{ matrix.name }}
    needs: browser-build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            name: Browser editors (1/3)
          - shard: 2
            name: Browser editors (2/3)
          - shard: 3
            name: Browser editors (3/3)
    env:
      NIMBLEOFFICE_BROWSER_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure test paths
        run: |
          printf '%s\n' \
            "NIMBLEOFFICE_BROWSER_OUTPUT=$RUNNER_TEMP/browser-results" \
            "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: e2e-browser-build

      - name: Resolve the Playwright version
        id: playwright
        run: |
          version="$(bunx playwright --version | awk '{print $2}')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install headless Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run the production editors in Chromium
        run: bunx playwright test --config e2e/browser/playwright.config.ts --pass-with-no-tests

      - name: Run the editor plugin hosts in Chromium
        run: bunx playwright test --config e2e/browser/plugin-host/playwright.config.ts --pass-with-no-tests

      - name: Run the harness-gated docx editor in Chromium
        if: matrix.shard == 3
        env:
          DOCX_PEERLESS_HARNESS: '1'
          NIMBLEOFFICE_BROWSER_SHARD: ''
          NIMBLEOFFICE_BROWSER_OUTPUT: ${{ runner.temp }}/browser-results/harness
        run: |
          bun run --filter @nimbleoffice/docx-react build
          bun run --filter @nimbleoffice/desktop build
          bunx playwright test --config e2e/browser/playwright.config.ts --grep @harness

      - name: Upload browser report and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-browser-${{ matrix.shard }}
          path: ${{ runner.temp }}/browser-results
          if-no-files-found: warn
          retention-days: 14
