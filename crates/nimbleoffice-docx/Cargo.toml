[package]
name = "nimbleoffice-docx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Typed native Rust facade for DOCX parsing, editing, layout, and serialization."
readme = "README.md"
keywords = ["docx", "word", "ooxml", "wordprocessingml"]
categories = ["parser-implementations", "rendering"]

[features]
default = ["raster", "fonts", "fonts-latin", "fonts-intl", "fonts-cjk"]
fonts = ["nimbleoffice-fonts/manager", "docx-layout/font-registration", "dep:ooxml-text", "dep:serde_json"]
fonts-latin = ["fonts", "nimbleoffice-fonts/fonts-latin"]
fonts-intl = ["fonts", "nimbleoffice-fonts/fonts-intl"]
fonts-cjk = ["fonts", "nimbleoffice-fonts/fonts-cjk"]
pdf = ["raster", "dep:docx-pdf"]
raster = ["dep:yrs", "dep:docx-raster", "dep:ooxml-text", "dep:serde_json", "docx-edit/base-latin", "docx-layout/base-latin"]

[dependencies]
nimbleoffice-fonts = { workspace = true }
docx-edit.workspace = true
docx-layout.workspace = true
docx-parse.workspace = true
docx-raster = { workspace = true, optional = true }
docx-pdf = { workspace = true, optional = true }
ooxml-text = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
sha2 = "0.10"
yrs = { version = "0.27.3", optional = true }

[dev-dependencies]
ooxml-fidelity = { package = "nimbleoffice-ooxml-fidelity", path = "../ooxml-fidelity" }
ooxml-opc.workspace = true
png = "0.18"
serde_json = "1"

[[example]]
name = "export_pdf"
required-features = ["pdf"]
